services:
  certbot-init:
    build:
      context: .
      dockerfile: Dockerfile.certbot
    image: ${IMAGE_NAME}-certbot
    container_name: ${CONTAINER_NAME}-certbot-init
    env_file:
      - broker.env
    environment:
      CERTBOT_MODE: init
    network_mode: host
    volumes:
      - "${BASE_DIR}/letsencrypt:/etc/letsencrypt:z"
      - "${BASE_DIR}/letsencrypt-lib:/var/lib/letsencrypt:z"

  certbot-renew:
    build:
      context: .
      dockerfile: Dockerfile.certbot
    image: ${IMAGE_NAME}-certbot
    container_name: ${CONTAINER_NAME}-certbot-renew
    env_file:
      - broker.env
    environment:
      CERTBOT_MODE: renew
    restart: unless-stopped
    depends_on:
      certbot-init:
        condition: service_completed_successfully
    network_mode: host
    volumes:
      - "${BASE_DIR}/letsencrypt:/etc/letsencrypt:z"
      - "${BASE_DIR}/letsencrypt-lib:/var/lib/letsencrypt:z"

  broker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}
    env_file:
      - broker.env
    restart: unless-stopped
    depends_on:
      certbot-init:
        condition: service_completed_successfully
    network_mode: host
    volumes:
      - "${BASE_DIR}/letsencrypt:/etc/letsencrypt:ro,z"
      - "${BASE_DIR}/data:/mosquitto/data:z"
